name: Bug report
description: Report a reproducible problem with synaptic-memory.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small reproduction is the fastest path to a fix.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Paste the smallest code sample or commands that reproduce the issue.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, synaptic-memory version, OS, backend, and installed extras.
      value: |
        - Python:
        - synaptic-memory:
        - OS:
        - Backend:
        - Extras:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace
      render: text
    validations:
      required: false
